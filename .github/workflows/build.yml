name: Napi adatcsomag

on:
  schedule:
    - cron: "40 20 * * *"   # a tcgcsv build (~20:05 UTC) után
  workflow_dispatch:
    inputs:
      force:
        description: "Építés akkor is, ha nincs újabb adat"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Van újabb adat?
        id: check
        run: python should_build.py "https://github.com/${{ github.repository }}/releases/download/latest/manifest.json"

      - name: Adatbázis építése
        if: steps.check.outputs.build == 'true' || inputs.force
        run: python build_tcgcsv_db.py

      # Az EUR árak (Cardmarket) kiegészítések: ha ez a lépés elbukik, az USD
      # adatcsomag EUR nélkül is kimegy (a script csak egészben írja az adatot).
      - name: EUR árak hozzáadása (Cardmarket)
        if: steps.check.outputs.build == 'true' || inputs.force
        continue-on-error: true
        run: python add_eur_prices.py

      # TCGdex képcímek (assets.tcgdex.net) a TCGplayer helyett. Naponta legfeljebb
      # 3000 képet ellenőriz; az állapot (image_check.json) a Release mellékleteként
      # megy tovább napról napra. Hiba esetén a régi képcímek maradnak.
      - name: TCGdex képek ellenőrzése
        if: steps.check.outputs.build == 'true' || inputs.force
        continue-on-error: true
        run: |
          gh release download latest -p image_check.json --clobber || echo "Még nincs állapotfájl."
          python add_tcgdex_images.py cards.sqlite --state image_check.json --limit 3000
          gh release upload latest image_check.json --clobber

      - name: Ellenőrzés
        if: steps.check.outputs.build == 'true' || inputs.force
        run: python check_db.py

      - name: Tömörítés és manifest
        if: steps.check.outputs.build == 'true' || inputs.force
        run: python pack.py

      - name: Feltöltés a latest Release-be
        if: steps.check.outputs.build == 'true' || inputs.force
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Legfrissebb adatcsomag" --notes "Automatikusan frissül. Lásd: manifest.json"
          gh release upload latest cards.sqlite.gz manifest.json --clobber
